# Runs on every pull request and on main: typecheck, lint, a dependency audit, and the Firestore
# rules tests against the emulator.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      # Fails only on critical advisories in packages that ship in the app; the rest are in
      # Expo's build tooling and are reported by Dependabot.
      - run: npm audit --omit=dev --audit-level=critical

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firestore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
